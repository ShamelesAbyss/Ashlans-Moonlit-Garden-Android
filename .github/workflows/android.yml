name: Native Android build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run native game and migration unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build installable development APK and unsigned release-validation variant
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Run native UI smoke test and capture the garden
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/screenshots
            adb shell am force-stop com.shamelesabyss.ashlansmoonlitgarden.native
            adb shell am start -n com.shamelesabyss.ashlansmoonlitgarden.native/com.shamelesabyss.moonlitgarden.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/moonlit-garden.png
            adb pull /sdcard/moonlit-garden.png app/build/screenshots/native-garden.png
      - name: Verify package, debug identity, alignment and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          BADGING="$("$TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.shamelesabyss.ashlansmoonlitgarden.native' versionCode='100' versionName='1.0.0'"
          printf '%s\n' "$BADGING" | grep -q '^application-debuggable'
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > app/build/outputs/apk/debug/signing.txt
          grep -F 'Number of signers: 1' app/build/outputs/apk/debug/signing.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS
          printf 'Package: com.shamelesabyss.ashlansmoonlitgarden.native\nVersion: 1.0.0 (100)\nBuild type: debuggable, Android debug certificate; not production-signed\n' > app/build/outputs/apk/debug/BUILD-INFO.txt
      - name: Upload installable development APK and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-rebirth-development-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD-INFO.txt
            app/build/outputs/apk/debug/signing.txt
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/screenshots/native-garden.png
          if-no-files-found: error

  publish-development-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build tagged installable development APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify and package release assets
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > signing.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          cp "$APK" Ashlans-Moonlit-Garden-${GITHUB_REF_NAME}-DEBUG.apk
          sha256sum "Ashlans-Moonlit-Garden-${GITHUB_REF_NAME}-DEBUG.apk" > SHA256SUMS
          cp signing.txt SIGNING-INFO.txt
      - name: Publish clearly labeled development APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          # Moonlit Rebirth — native Android development build

          This is an installable **debug-signed development APK**, not a production-signed stable Android release. The APK is built from the tagged native Kotlin/Jetpack Compose source and can coexist with the earlier app because it uses a distinct application ID.

          ## Install
          1. Download the APK and `SHA256SUMS` below.
          2. Verify the checksum before installing.
          3. On Android, allow installation from the source you used to download the APK, then open it.

          Debug signing is not a durable update identity; later debug APKs may use a different certificate and Android may refuse an in-place update. Export JSON backups and keep them somewhere you control before uninstalling an existing native build. No production signing key is included in this repository or release.

          The original soundtrack is not bundled while public redistribution rights for the MP3 and cover remain unresolved. The app remains offline-first and does not request Internet permission.
          EOF
          gh release create "$GITHUB_REF_NAME" "Ashlans-Moonlit-Garden-${GITHUB_REF_NAME}-DEBUG.apk" SHA256SUMS SIGNING-INFO.txt --title "$GITHUB_REF_NAME — Moonlit Rebirth (development build)" --notes-file RELEASE-NOTES.md
